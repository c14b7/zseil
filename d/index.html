<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyżury Nauczycieli - ZSEIL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👮‍♂️ Dyżury Nauczycieli - ZSEIL</h1>
            <p>Wybierz nauczyciela aby zobaczyć jego dyżury</p>
        </header>
        
        <main>
            <div class="controls">
                <div class="selector-container">
                    <select id="teacher-selector">
                        <option value="">Wybierz nauczyciela...</option>
                    </select>
                    <button id="load-btn" disabled>Pokaż dyżury</button>
                </div>
            </div>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Ładowanie dyżurów...</p>
            </div>
            
            <div id="duty-container" class="duty-container">
                <div id="error-message" class="error-message hidden"></div>
                <div id="teacher-info" class="teacher-info hidden">
                    <h2 id="selected-teacher"></h2>
                </div>
                <div id="duty-schedule" class="duty-schedule hidden">
                    <div class="day-column" data-day="monday">
                        <h3>Poniedziałek</h3>
                        <div class="duties-list"></div>
                    </div>
                    <div class="day-column" data-day="tuesday">
                        <h3>Wtorek</h3>
                        <div class="duties-list"></div>
                    </div>
                    <div class="day-column" data-day="wednesday">
                        <h3>Środa</h3>
                        <div class="duties-list"></div>
                    </div>
                    <div class="day-column" data-day="thursday">
                        <h3>Czwartek</h3>
                        <div class="duties-list"></div>
                    </div>
                    <div class="day-column" data-day="friday">
                        <h3>Piątek</h3>
                        <div class="duties-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
