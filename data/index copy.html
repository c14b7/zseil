<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Lekcji - ZSEIL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Plan Lekcji - ZSEIL</h1>
            <p>Wybierz klasę, nauczyciela lub salę</p>
        </header>
        
        <main>
            <div class="controls">
                <div class="filter-group">
                    <label>
                        <input type="radio" name="filter-type" value="klasa" checked>
                        Klasa
                    </label>
                    <label>
                        <input type="radio" name="filter-type" value="nauczyciel">
                        Nauczyciel
                    </label>
                    <label>
                        <input type="radio" name="filter-type" value="sala">
                        Sala
                    </label>
                </div>
                
                <div class="selector-container">
                    <select id="item-selector">
                        <option value="">Wybierz...</option>
                    </select>
                    <button id="load-btn">Pokaż plan</button>
                </div>
            </div>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Ładowanie planu...</p>
            </div>
            
            <div id="schedule-container" class="schedule-container">
                <div id="error-message" class="error-message hidden"></div>
                <table id="schedule-table" class="schedule-table hidden">
                    <thead>
                        <tr>
                            <th>Godzina</th>
                            <th>Poniedziałek</th>
                            <th>Wtorek</th>
                            <th>Środa</th>
                            <th>Czwartek</th>
                            <th>Piątek</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
